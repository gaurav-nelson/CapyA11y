id: pf-menutoggle-icon-only-name
pack: patternfly-v6
severity: error
wcag: ["4.1.2"]
autofix: suggest
message: >
  Icon-only MenuToggle (e.g. kebab) needs an aria-label.
helpUrl: https://www.patternfly.org/components/menus/menu-toggle/accessibility
education: >
  Kebab and plain icon toggles have no visible text; provide a
  descriptive accessible name.
detect:
  component: MenuToggle
  from: "@patternfly/react-core"
  when:
    noVisibleText: true
    missingAnyOfProps: ["aria-label", "aria-labelledby"]
fix:
  addProp:
    aria-label: "{{inferFromIconOrContext}}"
