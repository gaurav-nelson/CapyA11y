id: pf-checkbox-id-label
pack: patternfly-v6
severity: error
wcag: ["1.3.1", "4.1.2"]
autofix: suggest
message: >
  Checkbox should have an id and an accessible name (label,
  aria-label, or aria-labelledby).
helpUrl: https://www.patternfly.org/components/checkbox/accessibility
education: >
  PatternFly Checkbox uses id for label association. Always provide
  a name.
detect:
  component: Checkbox
  from: "@patternfly/react-core"
  when:
    missingAnyOfProps: ["label", "aria-label", "aria-labelledby"]
fix:
  addProp:
    aria-label: "{{inferPurpose}}"
    id: "checkbox-todo"
