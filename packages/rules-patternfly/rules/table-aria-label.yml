id: pf-table-aria-label
pack: patternfly-v6
severity: error
wcag: ["1.3.1", "4.1.2"]
autofix: suggest
message: >
  Table should have an aria-label (or labelledby) describing its
  purpose.
helpUrl: https://www.patternfly.org/components/table/accessibility
education: >
  Tables need an accessible name so users can distinguish multiple
  tables on a page.
detect:
  component: Table
  from: "@patternfly/react-table"
  when:
    missingAnyOfProps: ["aria-label", "aria-labelledby"]
fix:
  addProp:
    aria-label: "{{inferTablePurpose}}"
example:
  before: |
    <Table><Thead>...</Thead></Table>
  after: |
    <Table aria-label="Users"><Thead>...</Thead></Table>
