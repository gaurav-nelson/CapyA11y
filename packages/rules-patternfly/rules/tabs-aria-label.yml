id: pf-tabs-unique-label
pack: patternfly-v6
severity: warning
wcag: ["1.3.1", "4.1.2"]
autofix: suggest
message: >
  Tabs should have an aria-label describing the tab list purpose,
  especially when multiple Tabs appear on a page.
helpUrl: https://www.patternfly.org/components/tabs/accessibility
education: >
  Unique names help users distinguish multiple tablists.
detect:
  component: Tabs
  from: "@patternfly/react-core"
  when:
    missingAnyOfProps: ["aria-label", "aria-labelledby"]
fix:
  addProp:
    aria-label: "{{inferPurpose}}"
