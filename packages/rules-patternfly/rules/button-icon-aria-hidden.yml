id: pf-button-icon-aria-hidden
pack: patternfly-v6
severity: warning
wcag: ["1.1.1"]
autofix: safe
message: >
  Decorative icon inside Button should set aria-hidden so it is not
  announced separately from the button name.
helpUrl: https://www.patternfly.org/components/button/accessibility
education: >
  Icons that duplicate the button's accessible name should be hidden
  from assistive technologies.
detect:
  component: Button
  from: "@patternfly/react-core"
  when:
    decorativeIconChildMissingHidden: true
fix:
  addAriaHiddenToIconChildren: true
example:
  before: |
    <Button aria-label="Search"><SearchIcon /></Button>
  after: |
    <Button aria-label="Search"><SearchIcon aria-hidden /></Button>
