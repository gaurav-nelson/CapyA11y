id: pf-alert-toast-live-region
pack: patternfly-v6
severity: error
wcag: ["4.1.3"]
autofix: safe
message: >
  Toast AlertGroup should set isLiveRegion so status messages are
  announced to assistive technologies.
helpUrl: https://www.patternfly.org/components/alert/accessibility
education: >
  Toast alerts are dynamic status updates. Without a live region,
  screen readers may never announce them.
detect:
  component: AlertGroup
  from: "@patternfly/react-core"
  when:
    toastWithoutLiveRegion: true
fix:
  addProp:
    isLiveRegion: "true"
example:
  before: |
    <AlertGroup isToast>{alerts}</AlertGroup>
  after: |
    <AlertGroup isToast isLiveRegion>{alerts}</AlertGroup>
