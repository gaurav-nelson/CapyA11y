id: wcag-anchor-empty
pack: wcag-core
severity: error
wcag: ["2.4.4", "4.1.2"]
autofix: suggest
message: >
  Anchor has no accessible name. Provide link text or aria-label.
helpUrl: https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html
education: >
  Links without a name are announced as "link" with no destination.
detect:
  tagName: a
  when:
    noVisibleText: true
    missingAnyOfProps: ["aria-label", "aria-labelledby"]
fix:
  addProp:
    aria-label: "{{inferPurpose}}"
