id: wcag-textarea-unlabeled
pack: wcag-core
severity: error
wcag: ["1.3.1", "3.3.2", "4.1.2"]
autofix: suggest
message: >
  Textarea has no accessible name. Associate a label or provide
  aria-label / aria-labelledby.
helpUrl: https://www.w3.org/WAI/WCAG22/Understanding/labels-or-instructions.html
education: >
  Textareas need an accessible name so users know what content to provide.
detect:
  tagName: textarea
  when:
    unlabeledControl: true
fix:
  addProp:
    aria-label: "{{inferPurpose}}"
